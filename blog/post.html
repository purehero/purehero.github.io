<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글 · purehero Tech Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
<link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" disabled>
<script>
  (function () { try { document.documentElement.dataset.theme = localStorage.getItem("blog-theme") || "mono"; } catch (e) {} })();
</script>
</head>
<body>
<div class="read-progress" id="readProgress"></div>

<main class="layout" id="layout">
  <article>
    <div id="articleRoot">
      <div class="notice"><span class="spinner"></span> 불러오는 중…</div>
    </div>

    <section id="comments" class="comments hidden">
      <h2>댓글 <span id="commentCount"></span></h2>
      <div id="commentList"></div>
      <div id="commentFormWrap"></div>
    </section>
  </article>

  <aside class="sidebar">
    <div class="side-box toc-box hidden" id="tocBox">
      <h3>목차</h3>
      <nav id="toc" class="toc"></nav>
    </div>
    <div class="side-box" id="adminBox" style="display:none">
      <h3>관리</h3>
      <div class="btn-row">
        <a class="btn" id="editLink">수정</a>
        <button class="btn danger" id="deleteBtn">삭제</button>
      </div>
    </div>
  </aside>
</main>

<script type="module">
import {
  db, auth, collection, doc, getDoc, getDocs, addDoc, deleteDoc,
  query, where, orderBy, serverTimestamp, limit, limitToLast,
  renderMarkdown, highlightWithin, decorateLinks, slugifyHeading,
  fmtDate, escapeHtml, getParam, mountHeader, mountFooter, readingTime,
  onUser, isAdmin, login,
} from "./common.js";

mountHeader();
mountFooter();

const id = getParam("id");
const root = document.getElementById("articleRoot");
const layout = document.getElementById("layout");

let currentUser = null;
let post = null;

onUser((u) => {
  currentUser = u;
  refreshAdminBox();
  refreshCommentForm();
});

if (!id) {
  root.innerHTML = `<div class="notice error">잘못된 접근입니다. (글 id 없음)</div>`;
} else {
  loadPost();
}

async function loadPost() {
  try {
    const snap = await getDoc(doc(db, "posts", id));
    if (!snap.exists()) {
      root.innerHTML = `<div class="notice error">존재하지 않는 글입니다.</div>`;
      return;
    }
    post = { id: snap.id, ...snap.data() };
    document.title = `${post.title} · purehero Tech Guide`;
    renderArticle();
    refreshAdminBox();
    loadComments();
    refreshCommentForm();
  } catch (e) {
    console.error(e);
    root.innerHTML = `<div class="notice error">불러오기 실패<br><small>${escapeHtml(e.message)}</small></div>`;
  }
}

function renderArticle() {
  const tags = (post.tags || []).map((t) =>
    `<a class="tag" href="./index.html?tag=${encodeURIComponent(t)}">${escapeHtml(t)}</a>`).join("");
  const cover = post.coverImage
    ? `<img class="cover" src="${escapeHtml(post.coverImage)}" alt="">` : "";
  root.innerHTML = `
    <div class="article-head">
      <span class="eyebrow">${escapeHtml((post.tags || [])[0] || "GUIDE")}</span>
      <h1>${escapeHtml(post.title)}</h1>
      <div class="meta">
        <span>${fmtDate(post.createdAt)}</span>
        <span>·</span><span>약 ${readingTime(post.content)}분 읽기</span>
        ${post.authorEmail ? `<span>·</span><span>${escapeHtml(post.authorEmail)}</span>` : ""}
      </div>
      <div class="tags">${tags}</div>
      ${cover}
    </div>
    <div class="article" id="articleBody"></div>
    <div class="btn-row share-row">
      <button class="btn" id="copyLinkBtn" type="button">🔗 링크 복사</button>
    </div>
    <nav class="post-nav" id="postNav"></nav>`;

  const body = document.getElementById("articleBody");
  body.innerHTML = renderMarkdown(post.content);
  highlightWithin(body);
  decorateLinks(body);
  addCopyButtons(body);
  buildToc(body);
  mountLiveScores(body);
  document.getElementById("comments").classList.remove("hidden");

  const copyBtn = document.getElementById("copyLinkBtn");
  copyBtn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      copyBtn.textContent = "✓ 복사됨";
      setTimeout(() => { copyBtn.textContent = "🔗 링크 복사"; }, 1600);
    } catch { alert("복사에 실패했습니다."); }
  };
  loadNav();
}

// 코드 블록마다 복사 버튼 부착
function addCopyButtons(container) {
  container.querySelectorAll("pre").forEach((pre) => {
    const btn = document.createElement("button");
    btn.className = "code-copy";
    btn.type = "button";
    btn.textContent = "복사";
    btn.onclick = async () => {
      try {
        const code = pre.querySelector("code");
        await navigator.clipboard.writeText(code ? code.innerText : pre.innerText);
        btn.textContent = "복사됨 ✓";
        setTimeout(() => { btn.textContent = "복사"; }, 1500);
      } catch { /* noop */ }
    };
    pre.appendChild(btn);
  });
}

// ---- 실시간 스코어 위젯 -----------------------------------------------------
// 본문에 <div class="livescores" data-league="4328" data-title="…"></div> 를 두면
// 여기서 TheSportsDB 무료 API(키 불필요·CORS 허용)로 실제 경기 결과를 가져와 채운다.
// (스크립트는 신뢰된 post.html 에 있으므로 DOMPurify 로 제거되지 않는다.)
function mountLiveScores(container) {
  const nodes = container.querySelectorAll(".livescores");
  if (!nodes.length) return;
  const KEY = "123"; // TheSportsDB 무료 테스트 키
  const fetchPast = async (league) => {
    const url = `https://www.thesportsdb.com/api/v1/json/${KEY}/eventspastleague.php?id=${encodeURIComponent(league)}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    return data.events || [];
  };
  const row = (e) => {
    const hs = e.intHomeScore, as = e.intAwayScore;
    const done = hs != null && hs !== "" && as != null && as !== "";
    const st = (e.strStatus && !["Match Finished", "FT"].includes(e.strStatus))
      ? e.strStatus : (e.dateEvent || "");
    return `<li class="ls-row">
      <span class="ls-team home">${escapeHtml(e.strHomeTeam || "")}</span>
      <span class="ls-score">${done ? `${hs}<i>:</i>${as}` : "vs"}</span>
      <span class="ls-team away">${escapeHtml(e.strAwayTeam || "")}</span>
      <span class="ls-status">${escapeHtml(st)}</span>
    </li>`;
  };
  nodes.forEach((node) => {
    const league = node.dataset.league || "4328"; // 기본: 잉글랜드 프리미어리그
    const title = node.dataset.title || "최근 경기 결과";
    node.innerHTML =
      `<div class="ls-head"><span class="ls-live">● 자동갱신</span> ${escapeHtml(title)}
        <span class="ls-src">TheSportsDB</span></div>
       <ul class="ls-list"><li class="ls-loading"><span class="spinner"></span> 불러오는 중…</li></ul>
       <div class="ls-foot"></div>`;
    const listEl = node.querySelector(".ls-list");
    const footEl = node.querySelector(".ls-foot");
    const load = async () => {
      try {
        const events = await fetchPast(league);
        listEl.innerHTML = events.slice(0, 8).map(row).join("")
          || `<li class="ls-loading">경기 데이터가 없습니다.</li>`;
        const n = new Date();
        footEl.textContent =
          `업데이트 ${n.getHours()}:${String(n.getMinutes()).padStart(2, "0")} · 60초마다 자동 갱신`;
      } catch (err) {
        listEl.innerHTML = `<li class="ls-loading">데이터를 불러오지 못했습니다 (${escapeHtml(err.message)})</li>`;
      }
    };
    load();
    const timer = setInterval(load, 60000);
    window.addEventListener("beforeunload", () => clearInterval(timer));
  });
}

// 이전(과거)/다음(최신) 글 — 홈과 동일한 복합 색인(published+createdAt) 사용
async function loadNav() {
  const nav = document.getElementById("postNav");
  if (!nav || !post.createdAt) return;
  try {
    const posts = collection(db, "posts");
    const [olderSnap, newerSnap] = await Promise.all([
      getDocs(query(posts, where("published", "==", true),
        where("createdAt", "<", post.createdAt), orderBy("createdAt", "desc"), limit(1))),
      getDocs(query(posts, where("published", "==", true),
        where("createdAt", ">", post.createdAt), orderBy("createdAt", "desc"), limitToLast(1))),
    ]);
    const item = (snap, cls, label) => {
      if (snap.empty) return `<span class="pn ${cls} empty-slot"></span>`;
      const d = snap.docs[0];
      return `<a class="pn ${cls}" href="./post.html?id=${encodeURIComponent(d.id)}">
        <span class="pn-label">${label}</span>
        <span class="pn-title">${escapeHtml(d.data().title || "")}</span></a>`;
    };
    nav.innerHTML =
      item(olderSnap, "prev", "← 이전 글") + item(newerSnap, "next", "다음 글 →");
  } catch (e) {
    console.warn("post nav:", e);
    nav.innerHTML = "";
  }
}

// 읽기 진행률 바
const progressEl = document.getElementById("readProgress");
window.addEventListener("scroll", () => {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  progressEl.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + "%";
}, { passive: true });

function buildToc(body) {
  const headings = body.querySelectorAll("h2, h3");
  if (headings.length < 2) return;
  const toc = document.getElementById("toc");
  const seen = {};
  headings.forEach((h) => {
    let base = slugifyHeading(h.textContent);
    seen[base] = (seen[base] || 0) + 1;
    const hid = seen[base] > 1 ? `${base}-${seen[base]}` : base;
    h.id = hid;
    const a = document.createElement("a");
    a.href = `#${hid}`;
    a.textContent = h.textContent;
    a.className = h.tagName === "H3" ? "lvl-3" : "";
    a.addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById(hid).scrollIntoView({ behavior: "smooth" });
      history.replaceState(null, "", `#${hid}`);
    });
    toc.appendChild(a);
  });
  document.getElementById("tocBox").classList.remove("hidden");

  // 스크롤 위치에 따라 활성 목차 표시
  const links = [...toc.querySelectorAll("a")];
  const obs = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (en.isIntersecting) {
        links.forEach((l) => l.classList.toggle("active",
          l.getAttribute("href") === `#${en.target.id}`));
      }
    });
  }, { rootMargin: "-80px 0px -70% 0px" });
  headings.forEach((h) => obs.observe(h));
}

// ---- 관리 (수정/삭제) -------------------------------------------------------
function refreshAdminBox() {
  const box = document.getElementById("adminBox");
  if (post && isAdmin(currentUser)) {
    box.style.display = "";
    document.getElementById("editLink").href = `./write.html?id=${encodeURIComponent(post.id)}`;
    document.getElementById("deleteBtn").onclick = onDelete;
  } else {
    box.style.display = "none";
  }
}

async function onDelete() {
  if (!confirm("이 글을 삭제할까요? 되돌릴 수 없습니다.")) return;
  try {
    await deleteDoc(doc(db, "posts", post.id));
    alert("삭제되었습니다.");
    location.href = "./index.html";
  } catch (e) {
    alert("삭제 실패: " + e.message);
  }
}

// ---- 댓글 -------------------------------------------------------------------
async function loadComments() {
  const listEl = document.getElementById("commentList");
  try {
    const q = query(collection(db, "posts", id, "comments"), orderBy("createdAt", "asc"));
    const snap = await getDocs(q);
    document.getElementById("commentCount").textContent = `(${snap.size})`;
    if (snap.empty) {
      listEl.innerHTML = `<p class="empty" style="padding:16px 0">첫 댓글을 남겨보세요.</p>`;
      return;
    }
    listEl.innerHTML = snap.docs.map((d) => {
      const c = d.data();
      const photo = c.photoURL
        ? `<img class="avatar" src="${escapeHtml(c.photoURL)}" alt="">`
        : `<div class="avatar" style="background:var(--bg3)"></div>`;
      return `
        <div class="comment">
          ${photo}
          <div>
            <div><span class="who">${escapeHtml(c.name || "익명")}</span>
              <span class="when">${fmtDate(c.createdAt)}</span></div>
            <p class="text">${escapeHtml(c.body || "")}</p>
          </div>
        </div>`;
    }).join("");
  } catch (e) {
    console.error(e);
    listEl.innerHTML = `<div class="notice error"><small>${escapeHtml(e.message)}</small></div>`;
  }
}

function refreshCommentForm() {
  const wrap = document.getElementById("commentFormWrap");
  if (!post) { wrap.innerHTML = ""; return; }
  if (!currentUser) {
    wrap.innerHTML = `<div class="notice">댓글을 남기려면
      <a href="#" id="loginToComment">Google 로그인</a>이 필요합니다.</div>`;
    wrap.querySelector("#loginToComment").onclick = (e) => {
      e.preventDefault();
      login().catch((err) => alert("로그인 실패: " + err.message));
    };
    return;
  }
  wrap.innerHTML = `
    <form class="comment-form" id="cForm">
      <textarea id="cBody" placeholder="${escapeHtml(currentUser.displayName || "")} 님으로 댓글 작성…" required></textarea>
      <div class="btn-row">
        <button class="btn primary" type="submit">댓글 등록</button>
      </div>
    </form>`;
  wrap.querySelector("#cForm").addEventListener("submit", submitComment);
}

async function submitComment(e) {
  e.preventDefault();
  const body = document.getElementById("cBody").value.trim();
  if (!body) return;
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  try {
    await addDoc(collection(db, "posts", id, "comments"), {
      name: currentUser.displayName || currentUser.email,
      photoURL: currentUser.photoURL || "",
      authorEmail: currentUser.email,
      uid: currentUser.uid,
      body,
      createdAt: serverTimestamp(),
    });
    document.getElementById("cBody").value = "";
    loadComments();
  } catch (err) {
    alert("댓글 등록 실패: " + err.message);
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
