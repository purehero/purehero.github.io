<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글쓰기 · purehero Tech Guide</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css"
  media="(prefers-color-scheme: light)">
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css"
  media="(prefers-color-scheme: dark)">
</head>
<body>

<main class="layout single" id="main">
  <div id="gate" class="notice"><span class="spinner"></span> 인증 확인 중…</div>

  <section id="editor" class="hidden">
    <h1 id="pageTitle" style="letter-spacing:-.02em">새 글 작성</h1>

    <div class="field">
      <label for="title">제목</label>
      <input id="title" type="text" placeholder="글 제목">
    </div>

    <div class="field">
      <label for="tags">태그 (쉼표로 구분)</label>
      <input id="tags" type="text" placeholder="예: firebase, howto, 웹">
    </div>

    <div class="field">
      <label>대표 이미지 (선택)</label>
      <div class="btn-row">
        <button class="btn" type="button" id="coverBtn">이미지 업로드</button>
        <span id="coverStatus" class="drop-hint"></span>
      </div>
      <img id="coverPreview" class="hidden" style="margin-top:10px;max-width:320px;border-radius:10px;border:1px solid var(--border)">
      <input id="coverFile" type="file" accept="image/*" class="hidden">
    </div>

    <div class="field">
      <label>본문 (Markdown) — 이미지를 <b>드래그·붙여넣기</b>하면 Storage 에 업로드되어 자동 삽입됩니다</label>
      <div class="editor-grid">
        <div>
          <textarea id="content" placeholder="# 제목&#10;&#10;내용을 Markdown 으로 작성하세요.&#10;&#10;```js&#10;console.log('code');&#10;```"></textarea>
          <div class="drop-hint">
            <button class="btn" type="button" id="imgBtn" style="padding:4px 10px;font-size:.82rem">🖼 이미지 삽입</button>
            <span id="uploadStatus" class="uploading"></span>
          </div>
          <input id="inlineFile" type="file" accept="image/*" class="hidden">
        </div>
        <div class="preview-pane article" id="preview"></div>
      </div>
    </div>

    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input id="published" type="checkbox" checked style="width:auto"> 공개(발행) 상태로 저장
      </label>
    </div>

    <div class="btn-row">
      <button class="btn primary" id="saveBtn">저장</button>
      <a class="btn" href="./index.html">취소</a>
      <span id="saveStatus" class="drop-hint"></span>
    </div>
  </section>
</main>

<script type="module">
import {
  db, auth, storage, doc, getDoc, addDoc, setDoc, collection,
  serverTimestamp, storageRef, uploadBytes, getDownloadURL,
  renderMarkdown, highlightWithin, excerptFrom, escapeHtml, getParam,
  mountHeader, mountFooter, onUser, isAdmin, login,
} from "./common.js";

mountHeader("write");
mountFooter();

const editId = getParam("id");
let user = null;

const $ = (id) => document.getElementById(id);
const gate = $("gate");
const editor = $("editor");

// ---- 인증 게이트 ------------------------------------------------------------
onUser(async (u) => {
  user = u;
  if (!u) {
    gate.innerHTML = `글을 작성하려면 로그인이 필요합니다.<br><br>
      <button class="btn primary" id="loginBtn">Google 로그인</button>`;
    gate.classList.remove("hidden"); editor.classList.add("hidden");
    $("loginBtn").onclick = () => login().catch((e) => alert("로그인 실패: " + e.message));
    return;
  }
  if (!isAdmin(u)) {
    gate.className = "notice error";
    gate.innerHTML = `이 계정(${escapeHtml(u.email)})은 작성 권한이 없습니다.`;
    gate.classList.remove("hidden"); editor.classList.add("hidden");
    return;
  }
  gate.classList.add("hidden");
  editor.classList.remove("hidden");
  if (editId && !loaded) loadForEdit();
});

// ---- 미리보기 ---------------------------------------------------------------
const contentEl = $("content");
const previewEl = $("preview");
function updatePreview() {
  previewEl.innerHTML = renderMarkdown(contentEl.value);
  highlightWithin(previewEl);
}
contentEl.addEventListener("input", updatePreview);

// ---- 이미지 업로드 헬퍼 -----------------------------------------------------
// 파일명 안전화 + 경로: blog/images/<epoch>_<name>
function safeName(name) {
  return name.replace(/[^\w.\-]+/g, "_").slice(-80);
}
async function uploadImage(file) {
  // Date.now() 대신 performance 기반 + 랜덤 회피: 파일 크기·이름 조합으로 고유화
  const stamp = `${file.size}_${safeName(file.name)}`;
  const path = `blog/images/${Math.floor(performance.timeOrigin + performance.now())}_${stamp}`;
  const r = storageRef(storage, path);
  await uploadBytes(r, file, { contentType: file.type });
  return await getDownloadURL(r);
}

function insertAtCursor(text) {
  const el = contentEl;
  const start = el.selectionStart, end = el.selectionEnd;
  el.value = el.value.slice(0, start) + text + el.value.slice(end);
  el.selectionStart = el.selectionEnd = start + text.length;
  updatePreview();
}

async function handleInlineImage(file) {
  const status = $("uploadStatus");
  status.textContent = "이미지 업로드 중…";
  try {
    const url = await uploadImage(file);
    insertAtCursor(`\n![${file.name}](${url})\n`);
    status.textContent = "";
  } catch (e) {
    status.textContent = "";
    alert("이미지 업로드 실패: " + e.message);
  }
}

// 버튼 삽입
$("imgBtn").onclick = () => $("inlineFile").click();
$("inlineFile").addEventListener("change", (e) => {
  if (e.target.files[0]) handleInlineImage(e.target.files[0]);
  e.target.value = "";
});

// 붙여넣기
contentEl.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); handleInlineImage(item.getAsFile()); }
});

// 드래그 앤 드롭
contentEl.addEventListener("dragover", (e) => { e.preventDefault(); });
contentEl.addEventListener("drop", (e) => {
  const file = [...(e.dataTransfer?.files || [])].find((f) => f.type.startsWith("image/"));
  if (file) { e.preventDefault(); handleInlineImage(file); }
});

// ---- 대표 이미지 ------------------------------------------------------------
let coverUrl = "";
$("coverBtn").onclick = () => $("coverFile").click();
$("coverFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $("coverStatus").textContent = "업로드 중…";
  try {
    coverUrl = await uploadImage(file);
    const img = $("coverPreview");
    img.src = coverUrl; img.classList.remove("hidden");
    $("coverStatus").textContent = "완료";
  } catch (err) {
    $("coverStatus").textContent = "";
    alert("대표 이미지 업로드 실패: " + err.message);
  }
  e.target.value = "";
});

// ---- 수정 모드 로드 ---------------------------------------------------------
let loaded = false;
async function loadForEdit() {
  loaded = true;
  try {
    const snap = await getDoc(doc(db, "posts", editId));
    if (!snap.exists()) { alert("존재하지 않는 글입니다."); return; }
    const p = snap.data();
    $("pageTitle").textContent = "글 수정";
    $("title").value = p.title || "";
    $("tags").value = (p.tags || []).join(", ");
    contentEl.value = p.content || "";
    $("published").checked = p.published !== false;
    coverUrl = p.coverImage || "";
    if (coverUrl) {
      const img = $("coverPreview"); img.src = coverUrl; img.classList.remove("hidden");
    }
    updatePreview();
  } catch (e) {
    alert("불러오기 실패: " + e.message);
  }
}

// ---- 저장 -------------------------------------------------------------------
$("saveBtn").onclick = async () => {
  const title = $("title").value.trim();
  const content = contentEl.value.trim();
  if (!title) { alert("제목을 입력하세요."); return; }
  if (!content) { alert("본문을 입력하세요."); return; }

  const tags = $("tags").value.split(",").map((t) => t.trim()).filter(Boolean);
  const data = {
    title,
    content,
    excerpt: excerptFrom(content),
    tags,
    coverImage: coverUrl,
    published: $("published").checked,
    authorEmail: user.email,
    authorUid: user.uid,
    updatedAt: serverTimestamp(),
  };

  const btn = $("saveBtn");
  btn.disabled = true;
  $("saveStatus").innerHTML = `<span class="spinner"></span> 저장 중…`;
  try {
    let id = editId;
    if (editId) {
      await setDoc(doc(db, "posts", editId), data, { merge: true });
    } else {
      data.createdAt = serverTimestamp();
      const refDoc = await addDoc(collection(db, "posts"), data);
      id = refDoc.id;
    }
    location.href = `./post.html?id=${encodeURIComponent(id)}`;
  } catch (e) {
    $("saveStatus").textContent = "";
    btn.disabled = false;
    alert("저장 실패: " + e.message);
  }
};
</script>
</body>
</html>
